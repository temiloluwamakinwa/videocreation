name: Render job

# Actions tab → "Render job" → pick a job file (e.g. jobs/example.json). MP4 is attached as an artifact.
on:
  workflow_dispatch:
    inputs:
      job:
        description: 'Job file, e.g. jobs/example.json'
        required: true
        default: jobs/example.json
      quality:
        description: 'draft | standard | high'
        required: true
        default: standard
        type: choice
        options: [draft, standard, high]

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - run: node bin/vigenco.mjs render "${{ inputs.job }}" --quality "${{ inputs.quality }}" --out out/video.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: out/video.mp4
          retention-days: 30
